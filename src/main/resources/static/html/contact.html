<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact.pageTitle">Contact</title>
    <link rel="stylesheet" href="/css/contact.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>

<body>

<header class="header-class">
    <h1>Hardware hub</h1>
</header>

<nav class="navigationBar">
    <ul id="navList"></ul>
</nav>

<h2 data-i18n="contact.locationTitle">Location</h2>

<div class="location">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2781.3899965112!2d15.942423176475161!3d45.80344731246911!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4765d6c74453cd31%3A0xa7aba9e2288e126c!2sEricsson%20Nikola%20Tesla%20d.d.!5e0!3m2!1sen!2shr!4v1742980582183!5m2!1sen!2shr"
            width="100%"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</div>

<h2 data-i18n="contact.contactTitle">Contact us</h2>

<div class="contact-info">
    <div class="contact-item">
        <i class="fas fa-phone"></i>
        <span data-i18n="contact.phoneNumber">Phone number:</span>
        <a href="tel:+1234567890">+1 234 567 890</a>
    </div>

    <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <span data-i18n="contact.email">E-mail:</span>
        <a href="mailto:hardwarehub@fandom.com">hardwarehub@fandom.com</a>
    </div>
</div>

<footer class="footer-class">
    <p><b data-i18n="common.footer">&copy; Hardware Hub 2026 All rights reserved</b></p>
</footer>

<script src="/js/translations.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/navbar.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        applyTranslations();

        document.addEventListener("languageChanged", () => {
            applyTranslations();
        });
    });
</script>

</body>
</html>
